<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skiff</title>
    <!-- First paint: the app background of the last run (Harbor's before one), and no app until main.ts has styled, filled and drawn it. -->
    <script>try { var b = localStorage.getItem("skiff.startBg"); if (b) document.documentElement.style.setProperty("--start-bg", b); } catch (e) {}</script>
    <style>
      html, body { margin: 0; background: var(--start-bg, #0f1216); }
      /* Every node: a child that sets visibility: visible (the Projects +) would show through a hidden parent. */
      body:not(.ready) #app, body:not(.ready) #app * { visibility: hidden !important; }
      #start { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: var(--start-bg, #0f1216); }
      body.ready #start { display: none; }
      /* The promo porthole, at a 144px clip: the original clip on its own blue, in a circle. The drop shadow is softer than the promo's, for light themes. */
      @media (prefers-reduced-motion: reduce) { #start video { visibility: hidden; } }
      #start img, #start video { display: block; box-sizing: content-box; width: 144px; height: 144px; border-radius: 50%; object-fit: cover; background: #4c9ff0;
        border: 4px solid #1a0f2a; outline: 2px solid #b62fe8;
        box-shadow: 0 0 0 7px rgba(182, 47, 232, 0.1), 0 8px 20px rgba(0, 0, 0, 0.28), 0 0 28px rgba(182, 47, 232, 0.3); }
    </style>
    <script type="module" src="/src/entry.ts" defer></script>
  </head>
  <body>
    <!-- The start screen: the clip from the first paint, before the app's code loads. H.264 plays in WKWebView and WebView2; WebKitGTK without an H.264 decoder plays the VP9. The still is the poster. -->
    <div id="start" aria-hidden="true">
      <video id="start-mascot" muted loop autoplay playsinline disablepictureinpicture preload="auto" poster="./src/assets/start-mascot.jpg" width="144" height="144">
        <source src="./src/assets/start-mascot.mp4" type="video/mp4" />
        <source src="./src/assets/start-mascot.webm" type="video/webm" />
      </video>
      <!-- Reduced motion: the still in place of the clip. -->
      <script>(function () { var v = document.getElementById("start-mascot"); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) return; v.pause(); var i = document.createElement("img"); i.src = v.poster; i.alt = ""; i.width = i.height = 144; v.replaceWith(i); })();</script>
    </div>
    <div id="app">
      <header id="topbar">
        <div class="tb-cell wordmark">SKIFF</div>
        <button id="open-switcher" type="button" class="tb-cell search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <span class="spacer">Jump to project, worktree, or session</span><kbd>Ctrl K</kbd>
        </button>
        <div class="spacer"></div>
        <button id="next-waiting" type="button" class="tb-cell nx nx-waiting" title="Go to the next waiting session" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span class="label">Waiting</span><span id="waiting-count" class="num"></span>
        </button>
        <button id="next-unread" type="button" class="tb-cell nx nx-unread" title="Go to the next unread session" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h13l-3 4.5 3 4.5H5"></path></svg>
          <span class="label">Unread</span><span id="unread-count" class="num"></span>
        </button>
        <button id="open-settings" type="button" class="tb-cell gear" aria-label="Settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </header>
      <div id="body">
        <aside id="sidebar">
          <div id="sidebar-view"></div>
          <div id="sidebar-scroll"></div>
          <div id="select-bar" hidden></div>
        </aside>
        <main id="main">
          <div id="banner">
            <span id="keys-to">keys go to</span>
            <span class="sq"></span>
            <span id="focus-label" class="mono"></span>
            <span class="spacer"></span>
            <span id="group-label"></span>
          </div>
          <div id="terminal-host"></div>
        </main>
        <aside id="ledger" aria-label="Ledger" hidden></aside>
      </div>
      <footer id="statusbar" role="status" aria-live="polite">
        <span id="daemon" class="status-item"><span class="dot"></span><span id="daemon-label">connecting to skiffd</span></span>
        <button id="ws-status" class="status-item" type="button" aria-haspopup="menu" hidden></button>
        <span id="counts" class="status-item"></span>
        <span class="spacer"></span>
        <span id="memory" class="status-item mono dim"></span>
        <span id="socket" class="status-item mono dim"></span>
      </footer>
    </div>
  </body>
</html>
